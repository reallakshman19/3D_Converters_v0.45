name: Deploy app to GitHub Pages

on:
  # Every PR/branch merge into main creates a push to main.
  # This also intentionally deploys any direct main update.
  push:
    branches:
      - main

  # Validate the exact release-packaging/stamping code before merge.
  pull_request:
    paths:
      - '.github/workflows/deploy-app-on-main.yml'
      - 'scripts/stamp-pages-release-identity.py'
      - 'tests/pages-deployment-package.test.mjs'
  # Manual production redeploy when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('github-pages-identity-pr-{0}', github.event.pull_request.number) || 'github-pages-production' }}
  cancel-in-progress: false

jobs:
  verify-published-identity-package:
    name: Verify Pages release identity in real staged package (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual runtime package
        run: bash scripts/build-pages-package.sh "$RUNNER_TEMP/pages-site"
      - name: Stamp exact PR test SHA using production code
        run: |
          python3 scripts/stamp-pages-release-identity.py \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY"
      - name: Verify exact SHA and runtime asset closure
        env:
          PAGES_SITE_DIR: ${{ runner.temp }}/pages-site
          PAGES_EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 -m py_compile scripts/stamp-pages-release-identity.py
          node --test tests/pages-deployment-package.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy static app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build deterministic runtime-only Pages package
        run: bash scripts/build-pages-package.sh "$RUNNER_TEMP/pages-site"

      - name: Stamp exact main commit into deployed artifact
        run: |
          python3 scripts/stamp-pages-release-identity.py \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --require-main

      - name: Verify runtime package and exact release identity
        env:
          PAGES_SITE_DIR: ${{ runner.temp }}/pages-site
          PAGES_EXPECTED_SHA: ${{ github.sha }}
        run: node --test tests/pages-deployment-package.test.mjs

      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages serves exact main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ["EXPECTED_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = ("https://reallakshman19.github.io/3D_Converters_v0.45/"
                 "release-identity.json?run=" + run_id)
          for attempt in range(24):
              try:
                  request = urllib.request.Request(url,
                      headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      identity = json.load(response)
                  assert identity["schema"] == "xml-cii-production-deployment/v1"
                  assert identity["repository"] == os.environ["GITHUB_REPOSITORY"]
                  assert identity["commitSha"] == sha
                  assert identity["workflowRunId"] == run_id
                  print("PUBLISHED_PAGES_SHA_VERIFIED=" + sha)
                  break
              except Exception as exc:
                  if attempt == 23:
                      raise RuntimeError(
                          "Live GitHub Pages did not serve the exact deployed commit") from exc
                  time.sleep(5)
          PY
